spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/student_management
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:changeme-replace-in-production-with-256-bit-key}
      expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.studentmanagement: DEBUG
    org.springframework.security: INFO
